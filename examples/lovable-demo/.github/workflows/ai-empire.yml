name: AI-EMPIRE supervise
on:
  push:
    branches: [ lovable-dev, dev ]
  pull_request:
    branches: [ main ]

jobs:
  supervise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: W33Dplz/AI-Empire/.github/actions/supervise@main
        with:
          branch: ${{ github.head_ref || github.ref_name }}
          openai-key: ${{ secrets.OPENAI_API_KEY }}
